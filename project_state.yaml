project:
  name: EnterpriseBrain
  version: 0.1.22

environment:
  python: "3.12.10"
  postgres: "18"
  docker: true

vision:
  product_name: EnterpriseBrain
  current_goal: >
    Build an AI assistant that understands enterprise documents,
    especially PL/SQL documentation and database-related assets,
    and can answer project-specific questions.
  final_goal: >
    Build a multi-language enterprise knowledge assistant capable of
    understanding complete software systems including Database,
    Java, Spring Boot, Python, .NET, React, Angular, NodeJS,
    APIs, Infrastructure, CI/CD and Architecture directly from
    repositories and enterprise documents.
  current_scope:
    - Local document ingestion
    - TXT Reader
    - PL/SQL Document Question Answering
    - Interactive CLI Assistant
    - Complex PL/SQL Package Evaluation
    - Chunking
    - Embeddings
    - Vector Database
    - Document-Scoped Retrieval
    - RAG based Question Answering
    - Configurable Local LLM
  future_scope:
    - Basic Web UI
    - PDF Reader
    - DOCX Reader
    - Git Repository Ingestion
    - PL/SQL Dependency Analysis
    - Java Code Understanding
    - Spring Boot Understanding
    - Python Understanding
    - React Understanding
    - Angular Understanding
    - NodeJS Understanding
    - API Dependency Mapping
    - Cross-language Impact Analysis
    - Architecture Discovery
    - Code Change Impact Prediction
  non_goals:
    - AI Code Generation
    - Automated Code Modification
    - IDE Replacement

roadmap:
  current_phase: 1
  phases:
    - phase: 1
      name: "Document Knowledge Assistant"
      goal: >
        Build a document-based enterprise assistant using local
        documents.
    - phase: 2
      name: "Database Repository Assistant"
      goal: >
        Understand complete database repositories including
        Oracle PL/SQL.
    - phase: 3
      name: "Backend Repository Assistant"
      goal: >
        Understand Java, Spring Boot, Python and APIs.
    - phase: 4
      name: "Frontend Repository Assistant"
      goal: >
        Understand React, Angular and NodeJS projects.
    - phase: 5
      name: "EnterpriseBrain"
      goal: >
        Unified enterprise assistant capable of understanding
        complete enterprise applications.

