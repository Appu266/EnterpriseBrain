assistant_context:
  working_rules:
  - Never skip roadmap phases.
  - Always continue from current_task.
  - Prefer enterprise architecture.
  - Prefer modular design.
  - Avoid premature optimization.
  - Explain every important decision.
  - Keep documentation synchronized.
  - Test every completed milestone.
  - Provide exact terminal commands when a new file must be created.
  - Provide complete replacement content for every new or modified file.
  - Explain the purpose and expected outcome of each change before providing code.
  - Summarize completed changes after each verified milestone.
  - Do not edit project files; the user applies all changes manually.
  - Treat project_state.yaml as the single source of truth.
  - Read committed project files directly from GitHub whenever available.
  - Do not ask the user to paste files that are already committed to GitHub.
  - Focus on completing the basic PL/SQL assistant end to end before expanding to additional file types.
  - Complete basic UI validation before starting the next major capability iteration.
  - Do not compromise answer correctness for performance improvements.
  - Re-ingest the latest document content until reliable content-hash change detection is implemented.
user_learning_preferences:
  mentoring_style:
  - Teach step-by-step.
  - Give whole updated file instead of suggesting manual changes.
  - Explain why before how.
  - Assume beginner for unfamiliar topics.
  - Use enterprise best practices.
  - Build incrementally.
  - One task at a time.
  - Avoid unnecessary complexity.
  - Keep architecture consistent.
  - Provide PowerShell commands for creating every new file or folder.
  - Return the complete updated project_state.yaml after verified milestones.
  - Split project_state.yaml into contiguous parts only when required.
  - Avoid repeating questions whose answers are already available.
  - Prefer implementation over repeated architecture discussion.
architecture_decisions:
- date: '2026-07-28'
  decision: Repository Pattern adopted
- date: '2026-07-28'
  decision: Service Layer adopted
- date: '2026-07-28'
  decision: Knowledge schema introduced
- date: '2026-07-28'
  decision: Validator, Extractor and Loader separated
- date: '2026-07-28'
  decision: Documentation generation modularized
- date: '2026-07-29'
  decision: pgvector selected for vector storage
- date: '2026-07-29'
  decision: Sentence Transformer embeddings selected using all-MiniLM-L6-v2 model
- date: '2026-07-29'
  decision: Embedding vectors stored with document chunks using pgvector
- date: '2026-07-30'
  decision: Cosine distance selected for vector similarity search
- date: '2026-07-30'
  decision: Retrieval Service, Context Builder and QA Service introduced for RAG orchestration
- date: '2026-07-30'
  decision: LLM abstraction layer introduced to support multiple LLM providers
- date: '2026-07-31'
  decision: First end-to-end RAG pipeline validation completed successfully using QA flow test
- date: '2026-08-01'
  decision: ProcessingDocument introduced as the canonical in-memory model for documents flowing through
    the ingestion pipeline
- date: '2026-08-01'
  decision: DocumentLoader standardized to return ProcessingDocument with metadata and generated chunks
    attached
- date: '2026-08-01'
  decision: Interactive CLI assistant introduced as the first user-facing EnterpriseBrain interface
- date: '2026-08-01'
  decision: Retrieval restricted to the currently ingested document to prevent cross-document contamination
    of answers
- date: '2026-08-01'
  decision: EnterpriseBrain milestone achieved with the first complete end-to-end document ingestion and
    question-answering workflow
- date: '2026-08-01'
  decision: Complex synthetic PL/SQL package adopted for realistic MVP quality evaluation
- date: '2026-08-01'
  decision: PL/SQL-specific prompting introduced to improve grounded and concise answers
- date: '2026-08-01'
  decision: Retrieved context reduced to three chunks to balance answer quality and local inference performance
- date: '2026-08-01'
  decision: Ollama generation limited to 250 predicted tokens with low temperature for faster and more
    deterministic responses
- date: '2026-08-01'
  decision: Heavy AI imports deferred until after document-path input to improve perceived CLI responsiveness
- date: '2026-08-01'
  decision: llama3 removed because its local inference speed was impractical on the available 8 GB development
    laptop
- date: '2026-08-01'
  decision: qwen2.5:1.5b selected as the default local development LLM after reducing answer time from
    more than two minutes to approximately five to ten seconds
- date: '2026-08-01'
  decision: Ollama model name and base URL externalized through central application settings
- date: '2026-08-01'
  decision: Reusing stored document embeddings without source-content verification rejected to prevent
    stale-document answers
- date: '2026-08-01'
  decision: Current MVP will re-ingest the latest source file until SHA-256 based document change detection
    is implemented
- date: '2026-08-01'
  decision: Basic browser UI must be completed and validated before expanding EnterpriseBrain beyond the
    initial PL/SQL assistant scope
- date: '2026-08-01'
  decision: Assistant quality and correctness take priority over aggressive startup-time optimization
- date: '2026-08-02'
  decision: User Mode hides internal SQL, retrieval, embedding and ingestion diagnostics while DEBUG mode
    preserves them for development
- date: '2026-08-02'
  decision: Exact PL/SQL structural questions such as table extraction will use deterministic analysis
    instead of relying exclusively on the local 1.5B LLM
- date: '2026-08-02'
  decision: DocumentAssistantService adopted as the generic application entry point shared by CLI, Streamlit
    and future API-based Angular or React interfaces
- date: '2026-08-02'
  decision: Presentation interfaces must contain no document ingestion, retrieval, embedding or LLM orchestration
    logic
- date: '2026-08-02'
  decision: DocumentAssistantService is the generic application entry point for CLI, Streamlit and future
    API-based interfaces
- date: '2026-08-02'
  decision: Conversation history is passed through the generic QA pipeline to support contextual follow-up
    questions across all document types
- date: '2026-08-02'
  decision: Ambiguous follow-up questions use recent conversation messages when constructing the retrieval
    query
- date: '2026-08-02'
  decision: Streamlit is adopted only for the browser MVP; the long-term enterprise interface remains
    FastAPI with Angular or React
- date: '2026-08-02'
  decision: Iteration 1 prioritizes complete end-to-end foundations while answer quality improvements
    are deferred to a later iteration
- date: '2026-08-02'
  decision: Phase 1 is closed after validating a complete end-to-end document assistant through CLI and
    browser interfaces.
- date: '2026-08-02'
  decision: Known answer-quality and consistency limitations are accepted for the Phase 1 MVP and moved
    to a dedicated quality backlog.
- date: '2026-08-02'
  decision: Phase 2 begins with scalable repository ingestion and file-level metadata rather than PL/SQL-specific
    question patches.
- date: '2026-08-02'
  decision: The existing ingestion, embedding, retrieval, QA, LLM and presentation boundaries will remain
    the foundation for repository-level capabilities.
